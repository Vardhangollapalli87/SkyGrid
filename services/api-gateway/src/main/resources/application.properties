spring.application.name=api-gateway
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=45s

spring.cloud.gateway.server.webflux.routes[0].id=mission-api
spring.cloud.gateway.server.webflux.routes[0].uri=${MISSION_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/missions/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webflux.routes[1].id=mission-routes-api
spring.cloud.gateway.server.webflux.routes[1].uri=${MISSION_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/routes,/api/v1/routes/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webflux.routes[2].id=mission-airspace-api
spring.cloud.gateway.server.webflux.routes[2].uri=${MISSION_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/airspace/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RemoveRequestHeader=Origin

spring.cloud.gateway.server.webflux.routes[3].id=hazard-api
spring.cloud.gateway.server.webflux.routes[3].uri=${HAZARD_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/hazards/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RemoveRequestHeader=Origin
