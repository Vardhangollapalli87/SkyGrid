spring.application.name=hazard-service
server.port=${PORT:8082}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.default-property-inclusion=always
skygrid.weather.base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
skygrid.weather.connect-timeout=${WEATHER_CONNECT_TIMEOUT:3s}
skygrid.weather.read-timeout=${WEATHER_READ_TIMEOUT:6s}
skygrid.weather.max-forecast-hours=${WEATHER_MAX_FORECAST_HOURS:72}
skygrid.weather.max-route-length-km=${WEATHER_MAX_ROUTE_LENGTH_KM:250}
skygrid.weather.max-route-samples=${WEATHER_MAX_ROUTE_SAMPLES:12}
skygrid.weather.sample-spacing-km=${WEATHER_SAMPLE_SPACING_KM:25}
skygrid.weather.thresholds.wind-speed-ms=${WEATHER_WIND_SPEED_THRESHOLD_MS:12}
skygrid.weather.thresholds.wind-gust-ms=${WEATHER_WIND_GUST_THRESHOLD_MS:17}
skygrid.weather.thresholds.precipitation-mm-preceding-hour=${WEATHER_PRECIPITATION_THRESHOLD_MM_PRECEDING_HOUR:2}
skygrid.weather.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
